apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-disease-api}
  template:
    metadata:
      labels: {app: heart-disease-api}
    spec:
      containers:
      - name: api
        image: ghcr.io/REPLACE_WITH_GITHUB_USERNAME/heart-disease-api:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8000}]
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 15
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
spec:
  selector: {app: heart-disease-api}
  ports: [{port: 80, targetPort: 8000}]
  type: LoadBalancer
